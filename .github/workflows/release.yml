name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to build (e.g. v0.1)"
        required: false
        default: "v0.1"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install SQLite dev headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          STAGE="copyzer-${TAG}-linux-${{ matrix.arch }}"
          mkdir -p "${STAGE}"
          cp "target/${{ matrix.target }}/release/copyzer" "${STAGE}/copyzer"
          cp pkgbuild/copyzer.desktop "${STAGE}/copyzer.desktop"
          cp pkgbuild/copyzer.svg "${STAGE}/copyzer.svg"
          cp LICENSE README.md "${STAGE}/"
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            copyzer-*-linux-*.tar.gz
            copyzer-*-linux-*.tar.gz.sha256
