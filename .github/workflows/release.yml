name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to build (e.g. v0.2)"
        required: false
        default: "v0.2"

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Universal Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install SQLite dev headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package release archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          STAGE="copyzer-${TAG}-linux-${{ matrix.arch }}"
          mkdir -p "${STAGE}"
          cp "target/${{ matrix.target }}/release/copyzer" "${STAGE}/copyzer"
          cp pkgbuild/copyzer.desktop "${STAGE}/copyzer.desktop"
          cp pkgbuild/copyzer.svg "${STAGE}/copyzer.svg"
          cp LICENSE README.md "${STAGE}/"
          tar -czf "${STAGE}.tar.gz" "${STAGE}"
          sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"

      - name: Upload universal release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            copyzer-*-linux-*.tar.gz
            copyzer-*-linux-*.tar.gz.sha256

  build-arch-repo:
    name: Build Arch Pacman Package & Repo DB (x86_64)
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm git rust ifuse libimobiledevice usbmuxd
          useradd -m builder
          chown -R builder:builder .

      - uses: actions/checkout@v4

      - name: Build PKGBUILD and generate copyzer.db
        run: |
          chown -R builder:builder .
          su builder -c "cd pkgbuild && makepkg -sf --noconfirm"
          cd pkgbuild
          rm -f copyzer-debug-*.pkg.tar.zst
          PKG_FILE=$(ls copyzer-*.pkg.tar.zst | head -n 1)
          repo-add copyzer.db.tar.gz "${PKG_FILE}"
          # Replace symlinks with actual files so GitHub Releases serves copyzer.db directly
          rm -f copyzer.db copyzer.files
          cp -f copyzer.db.tar.gz copyzer.db
          cp -f copyzer.files.tar.gz copyzer.files

      - name: Upload Arch Pacman repo assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pkgbuild/copyzer-*.pkg.tar.zst
            pkgbuild/copyzer.db
            pkgbuild/copyzer.db.tar.gz
            pkgbuild/copyzer.files
            pkgbuild/copyzer.files.tar.gz
