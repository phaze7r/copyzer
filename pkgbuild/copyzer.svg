<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!-- Base dark tile (Swiss Minimalist, high contrast) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>

  <!-- Left: Minimal iPhone silhouette -->
  <rect x="11" y="15" width="18" height="34" rx="4" fill="#1E293B" stroke="#F8FAFC" stroke-width="2.5"/>
  <!-- Dynamic Island pill -->
  <rect x="17" y="18.5" width="6" height="2" rx="1" fill="#94A3B8"/>
  <!-- Media frame inside phone -->
  <rect x="14.5" y="24" width="11" height="14" rx="2" fill="#2563EB"/>
  <circle cx="18" cy="28" r="1.5" fill="#F8FAFC"/>
  <path d="M15.5 36 L19 32 L21.5 34.5 L23.5 32.5 L24.5 36 Z" fill="#F8FAFC"/>

  <!-- Center-Right: Fast "zer" transfer chevron + folder target -->
  <path d="M35 22 H49 C51.2 22 53 23.8 53 26 V42 C53 44.2 51.2 46 49 46 H35 C32.8 46 31 44.2 31 42 V26 C31 23.8 32.8 22 35 22 Z" fill="#1E293B" stroke="#2563EB" stroke-width="2.5"/>
  <!-- Fast amber bolt/arrow bridging phone to destination -->
  <path d="M27 32 H41 M36.5 26.5 L42.5 32 L36.5 37.5" fill="none" stroke="#F59E0B" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
