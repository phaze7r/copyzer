<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <style>
      .mono { font-family: "JetBrains Mono", "Fira Code", "Cascadia Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; }
      .bold { font-weight: 700; }
      .dim { fill: #64748B; }
      .muted { fill: #94A3B8; }
      .fg { fill: #F8FAFC; }
      .accent { fill: #2563EB; }
      .amber { fill: #F59E0B; }
      .green { fill: #22C55E; }
      .bg { fill: #0F172A; }
      .panel { fill: #0F172A; stroke: #334155; stroke-width: 1.5; }
    </style>
  </defs>

  <!-- Outer window frame -->
  <rect x="0" y="0" width="960" height="540" rx="12" fill="#0B1120" stroke="#1E293B" stroke-width="2"/>
  <!-- Window titlebar -->
  <rect x="1" y="1" width="958" height="34" rx="11" fill="#1E293B"/>
  <rect x="1" y="20" width="958" height="15" fill="#1E293B"/>
  <circle cx="22" cy="18" r="6" fill="#EF4444"/>
  <circle cx="42" cy="18" r="6" fill="#F59E0B"/>
  <circle cx="62" cy="18" r="6" fill="#22C55E"/>
  <text x="480" y="23" text-anchor="middle" class="mono muted" font-size="12">copyzer — ~/Pictures/Copyzer</text>

  <!-- Terminal canvas -->
  <rect x="16" y="44" width="928" height="480" rx="6" class="bg"/>

  <!-- Header box -->
  <rect x="24" y="52" width="912" height="42" rx="4" class="panel"/>
  <text x="38" y="78" class="mono bold accent">COPYZER v0.1</text>
  <rect x="152" y="61" width="238" height="24" rx="3" fill="#22C55E"/>
  <text x="162" y="78" class="mono bold" fill="#0F172A">iPhone 16 Pro (iOS 27.0.1)</text>
  <text x="412" y="78" class="mono fg">Dest: /home/batcillos/Pictures/Copyzer</text>

  <!-- Tabs box -->
  <rect x="24" y="102" width="912" height="40" rx="4" class="panel"/>
  <text x="40" y="127" class="mono bold accent">[1] Years &amp; Months</text>
  <text x="208" y="127" class="mono dim">│</text>
  <text x="232" y="127" class="mono muted">[2] Albums</text>
  <text x="336" y="127" class="mono dim">│</text>
  <text x="360" y="127" class="mono muted">[3] DCIM Folders</text>

  <!-- Main table box -->
  <rect x="24" y="150" width="912" height="316" rx="4" class="panel"/>
  <rect x="38" y="142" width="136" height="16" class="bg"/>
  <text x="44" y="155" class="mono muted">Years &amp; Months</text>

  <!-- Highlighted Row 0 -->
  <rect x="28" y="168" width="904" height="26" fill="#2563EB"/>
  <text x="34" y="186" class="mono bold" fill="#0F172A">▶ [x]  2026 (All)</text>
  <text x="720" y="186" class="mono bold" fill="#0F172A">1,420 files</text>
  <text x="845" y="186" class="mono bold" fill="#0F172A">6.84 GB</text>

  <!-- Row 1 -->
  <text x="52" y="214" class="mono bold green">[x]</text>
  <text x="108" y="214" class="mono fg">2026-11</text>
  <text x="720" y="214" class="mono muted">214 files</text>
  <text x="845" y="214" class="mono fg">1.12 GB</text>

  <!-- Row 2 -->
  <text x="52" y="240" class="mono bold green">[x]</text>
  <text x="108" y="240" class="mono fg">2026-10</text>
  <text x="720" y="240" class="mono muted">488 files</text>
  <text x="845" y="240" class="mono fg">2.31 GB</text>

  <!-- Row 3 -->
  <text x="52" y="266" class="mono muted">[ ]</text>
  <text x="108" y="266" class="mono fg">2026-07</text>
  <text x="720" y="266" class="mono muted">718 files</text>
  <text x="845" y="266" class="mono fg">3.41 GB</text>

  <!-- Row 4 -->
  <text x="52" y="292" class="mono muted">[ ]</text>
  <text x="92" y="292" class="mono fg">2025 (All)</text>
  <text x="720" y="292" class="mono muted">1,890 files</text>
  <text x="845" y="292" class="mono fg">7.92 GB</text>

  <!-- Row 5 -->
  <text x="52" y="318" class="mono muted">[ ]</text>
  <text x="108" y="318" class="mono fg">2025-12</text>
  <text x="720" y="318" class="mono muted">312 files</text>
  <text x="845" y="318" class="mono fg">1.45 GB</text>

  <!-- Row 6 -->
  <text x="52" y="344" class="mono muted">[ ]</text>
  <text x="108" y="344" class="mono fg">2025-09</text>
  <text x="720" y="344" class="mono muted">640 files</text>
  <text x="845" y="344" class="mono fg">2.84 GB</text>

  <!-- Row 7 -->
  <text x="52" y="370" class="mono muted">[ ]</text>
  <text x="92" y="370" class="mono fg">2024 (All)</text>
  <text x="720" y="370" class="mono muted">1,502 files</text>
  <text x="845" y="370" class="mono fg">3.66 GB</text>

  <!-- Row 8 -->
  <text x="52" y="396" class="mono muted">[ ]</text>
  <text x="108" y="396" class="mono fg">2024-08</text>
  <text x="720" y="396" class="mono muted">510 files</text>
  <text x="845" y="396" class="mono fg">1.29 GB</text>

  <!-- Row 9 -->
  <text x="52" y="422" class="mono muted">[ ]</text>
  <text x="108" y="422" class="mono fg">2024-03</text>
  <text x="720" y="422" class="mono muted">992 files</text>
  <text x="845" y="422" class="mono fg">2.37 GB</text>

  <!-- Footer box -->
  <rect x="24" y="474" width="912" height="42" rx="4" class="panel"/>
  <text x="38" y="500" class="mono fg">Ready: 4,812 items (18.42 GB)</text>
  <text x="322" y="500" class="mono dim">│</text>
  <text x="342" y="500" class="mono muted">? Help  Space Select  Enter Copy  d Dest  r Refresh  q Quit</text>
</svg>