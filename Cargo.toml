[package]
name = "copyzer"
version = "0.2.0"
edition = "2021"
description = "Fast, keyboard-first iPhone media copier for Arch Linux and Omarchy"
license = "MIT"
repository = "https://github.com/phaze7r/copyzer"
keywords = ["iphone", "archlinux", "omarchy", "tui", "media"]
categories = ["command-line-utilities", "multimedia"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
dirs = "6"
filetime = "0.2"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
walkdir = "2"
